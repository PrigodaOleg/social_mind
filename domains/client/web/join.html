<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Closers — Join / Присоединиться</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f2f4f8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    padding: 32px 28px;
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  h1 { font-size: 20px; color: #1a1c1e; margin-bottom: 12px; }
  p { font-size: 14px; color: #555; line-height: 1.5; margin-bottom: 10px; }
  .open-btn {
    display: inline-block;
    margin: 18px 0 10px;
    padding: 14px 28px;
    font-size: 16px;
    font-weight: 600;
    color: #ffffff;
    background: #3b5bdb;
    border: none;
    border-radius: 12px;
    text-decoration: none;
    cursor: pointer;
  }
  .open-btn:active { background: #3450b8; }
  .fallback { margin-top: 16px; font-size: 13px; }
  .fallback a { color: #3b5bdb; }
  .error { color: #c92a2a; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <h1>Closers</h1>
  <div id="content">
    <p>Opening the app&hellip;</p>
    <p>Открываем приложение&hellip;</p>
  </div>
</div>
<script>
(function () {
  var content = document.getElementById('content');
  var params = new URLSearchParams(window.location.search);
  var d = params.get('d');
  // The payload must be base64url without padding: A-Za-z0-9_- only.
  if (!d || !/^[A-Za-z0-9_-]+$/.test(d)) {
    content.innerHTML =
      '<p class="error">Invalid invitation link.</p>' +
      '<p class="error">Недействительная ссылка приглашения.</p>';
    return;
  }
  var appLink = 'closers://join?d=' + d;
  var webApp = 'https://prigodaoleg.github.io/social_mind/';
  // Automatic custom-scheme attempt (some browsers block it without a user gesture).
  window.location.replace(appLink);
  content.innerHTML =
    '<p>If the app did not open, tap the button:</p>' +
    '<p>Если приложение не открылось, нажмите кнопку:</p>' +
    '<a class="open-btn" href="' + appLink + '">Открыть в приложении / Open in app</a>' +
    '<p class="fallback">No app? / Нет приложения? ' +
    '<a href="' + webApp + '">Open the web app / Открыть веб-версию</a></p>';
})();
</script>
</body>
</html>
