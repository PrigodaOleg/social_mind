# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Closers Flutter

on:
  push:
    branches: [ "main" ]
    paths: [ "domains/client/**" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "domains/client/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
        contents: write
        pages: write
        id-token: write

    steps:
      - uses: actions/checkout@v4
      
      - name: 'Set up JDK 17'
        uses: 'actions/setup-java@v2'
        with:
          distribution: "temurin"
          java-version: '17'
        # Set up JDK 12 using the "actions/setup-java" action.

      - name: Set up Flutter
        uses: subosito/flutter-action@v2

      - name: Install dependencies
        working-directory: ./domains/client
        run: flutter pub get

      # Uncomment this step to verify the use of 'dart format' on each commit.
      # - name: Verify formatting
      #   run: dart format --output=none --set-exit-if-changed .

      # Consider passing '--fatal-infos' for slightly stricter analysis.
      #- name: Analyze project source
      #  working-directory: ./domains/client
      #  run: flutter analyze

      # Your project will need to have tests in test/ and a dependency on
      # package:test for this step to succeed. Note that Flutter projects will
      # want to change this to 'flutter test'.
      - name: Run tests
        working-directory: ./domains/client
        run: flutter test

      - name: Generate google-services.json
        working-directory: ./domains/client
        run: echo '{"project_info":{"project_number":"${{ secrets.CLOSERS_PROJECT_NUMBER }}","project_id":"${{ secrets.CLOSERS_PROJECT_ID }}","storage_bucket":"${{ secrets.CLOSERS_PROJECT_ID }}.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"${{ secrets.CLOSERS_ANDROID_APP_ID }}","android_client_info":{"package_name":"com.example.closers"}},"oauth_client":[],"api_key":[{"current_key":"${{ secrets.CLOSERS_ANDROID_API_KEY }}"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' >> android/app/google-services.json

      - name: 'Build APK'
        working-directory: ./domains/client
        id: 'build'
        run: |
          flutter build apk \
          --split-per-abi \
          --dart-define CLOSERS_PROJECT_ID=${{ secrets.CLOSERS_PROJECT_ID }} \
          --dart-define CLOSERS_PROJECT_NUMBER=${{ secrets.CLOSERS_PROJECT_NUMBER }} \
          --dart-define CLOSERS_ANDROID_API_KEY=${{ secrets.CLOSERS_ANDROID_API_KEY }} \
          --dart-define CLOSERS_ANDROID_APP_ID=${{ secrets.CLOSERS_ANDROID_APP_ID }} \
          --dart-define CLOSERS_DATABASE_URL=${{ secrets.CLOSERS_DATABASE_URL }}

      
      - name: 'Build web app'
        run: |
          flutter build web --release --base-href /social_mind/ \
          --dart-define CLOSERS_PROJECT_ID=${{ secrets.CLOSERS_PROJECT_ID }} \
          --dart-define CLOSERS_PROJECT_NUMBER=${{ secrets.CLOSERS_PROJECT_NUMBER }} \
          --dart-define CLOSERS_ANDROID_API_KEY=${{ secrets.CLOSERS_ANDROID_API_KEY }} \
          --dart-define CLOSERS_ANDROID_APP_ID=${{ secrets.CLOSERS_ANDROID_APP_ID }} \
          --dart-define CLOSERS_DATABASE_URL=${{ secrets.CLOSERS_DATABASE_URL }}
        working-directory: ./domains/client

      - name: 'Upload APK'
        uses: 'actions/upload-artifact@v4'
        with:
          name: 'Closers'
          path: './domains/client/build/app/outputs/flutter-apk/'
        # Upload the built APK

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./domains/client/build/web/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2

      - name: Install dependencies
        working-directory: ./domains/client
        run: flutter pub get

      # local_database_test.dart initializes the Isar core library from test/,
      # so provide the macOS binary shipped with isar_plus_flutter_libs.
      - name: Prepare Isar core library for macOS tests
        working-directory: ./domains/client
        run: |
          cp "$(find "$HOME/.pub-cache" -path '*isar_plus_flutter_libs*/macos/libisar.dylib' | head -n 1)" \
             test/libisar_macos.dylib

      - name: Run tests
        working-directory: ./domains/client
        run: flutter test

      - name: Run Firebase emulator integration tests
        working-directory: ./domains/client
        env:
          FLUTTER_WEB_CHROME: /usr/bin/google-chrome-stable
        run: |
          npm install -g firebase-tools@latest
          chmod +x tool/run_firebase_emulator_tests.sh
          tool/run_firebase_emulator_tests.sh

      - name: 'Build iOS (no codesign)'
        working-directory: ./domains/client
        run: |
          flutter build ios --release --no-codesign \
          --dart-define CLOSERS_PROJECT_ID=${{ secrets.CLOSERS_PROJECT_ID }} \
          --dart-define CLOSERS_PROJECT_NUMBER=${{ secrets.CLOSERS_PROJECT_NUMBER }} \
          --dart-define CLOSERS_IOS_API_KEY=${{ secrets.CLOSERS_IOS_API_KEY }} \
          --dart-define CLOSERS_IOS_APP_ID=${{ secrets.CLOSERS_IOS_APP_ID }} \
          --dart-define CLOSERS_DATABASE_URL=${{ secrets.CLOSERS_DATABASE_URL }}

      - name: 'Upload iOS app'
        uses: 'actions/upload-artifact@v4'
        with:
          name: 'Closers-iOS'
          path: './domains/client/build/ios/iphoneos/Runner.app'
        # Upload the built iOS app
