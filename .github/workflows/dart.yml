# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Closers Flutter

on:
  push:
    branches: [ "main" ]
    paths: [ "domains/client/**", ".github/workflows/**" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "domains/client/**", ".github/workflows/**" ]
  workflow_dispatch:

jobs:
  firebase-rules-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the compat check needs the old rules from git

      - name: 'Set up JDK 21'
        uses: 'actions/setup-java@v4'
        with:
          distribution: "temurin"
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      # ОПЦИОНАЛЬНО, НО КРАЙНЕ РЕКОМЕНДУЕТСЯ:
      # По умолчанию при первом старте эмулятор скачивает .jar файл базы данных.
      # Кэширование сэкономит время и исключит сетевые сбои.
      - name: Cache Firebase Emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('~/.cache/firebase/emulators/*.jar') }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-

      - name: Check RTDB rules backward compatibility
        working-directory: ./domains/client
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 tool/check_rules_backward_compatibility.py --base "origin/${{ github.base_ref }}"
          else
            # push to main: compare against the previous commit on main
            python3 tool/check_rules_backward_compatibility.py --base "HEAD~1"
          fi

  deploy-rules:
    runs-on: ubuntu-latest
    needs: [firebase-rules-compat]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Deploy RTDB rules
        working-directory: ./domains/client
        env:
          CLOSERS_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.CLOSERS_FIREBASE_SERVICE_ACCOUNT_JSON }}
          CLOSERS_PROJECT_ID: ${{ secrets.CLOSERS_PROJECT_ID }}
        run: python3 tool/deploy_firebase_rules.py

  build:
    runs-on: ubuntu-latest
    permissions:
        contents: write
        pages: write
        id-token: write

    steps:
      - uses: actions/checkout@v4
      
      - name: 'Set up JDK 21'
        uses: 'actions/setup-java@v4'
        with:
          distribution: "temurin"
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2

      - name: Install dependencies
        working-directory: ./domains/client
        run: flutter pub get

      - name: Run tests
        working-directory: ./domains/client
        run: flutter test

      - name: Generate google-services.json
        working-directory: ./domains/client
        run: echo '{"project_info":{"project_number":"${{ secrets.CLOSERS_PROJECT_NUMBER }}","project_id":"${{ secrets.CLOSERS_PROJECT_ID }}","storage_bucket":"${{ secrets.CLOSERS_PROJECT_ID }}.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"${{ secrets.CLOSERS_ANDROID_APP_ID }}","android_client_info":{"package_name":"com.example.closers"}},"oauth_client":[],"api_key":[{"current_key":"${{ secrets.CLOSERS_ANDROID_API_KEY }}"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' >> android/app/google-services.json

      - name: 'Build APK'
        working-directory: ./domains/client
        id: 'build'
        run: |
          flutter build apk \
          --split-per-abi \
          --dart-define CLOSERS_PROJECT_ID=${{ secrets.CLOSERS_PROJECT_ID }} \
          --dart-define CLOSERS_PROJECT_NUMBER=${{ secrets.CLOSERS_PROJECT_NUMBER }} \
          --dart-define CLOSERS_ANDROID_API_KEY=${{ secrets.CLOSERS_ANDROID_API_KEY }} \
          --dart-define CLOSERS_ANDROID_APP_ID=${{ secrets.CLOSERS_ANDROID_APP_ID }} \
          --dart-define CLOSERS_DATABASE_URL=${{ secrets.CLOSERS_DATABASE_URL }}

      - name: 'Build web app'
        run: |
          flutter build web --release --base-href /social_mind/ \
          --dart-define CLOSERS_PROJECT_ID=${{ secrets.CLOSERS_PROJECT_ID }} \
          --dart-define CLOSERS_PROJECT_NUMBER=${{ secrets.CLOSERS_PROJECT_NUMBER }} \
          --dart-define CLOSERS_ANDROID_API_KEY=${{ secrets.CLOSERS_ANDROID_API_KEY }} \
          --dart-define CLOSERS_ANDROID_APP_ID=${{ secrets.CLOSERS_ANDROID_APP_ID }} \
          --dart-define CLOSERS_DATABASE_URL=${{ secrets.CLOSERS_DATABASE_URL }}
        working-directory: ./domains/client

      - name: 'Upload APK'
        uses: 'actions/upload-artifact@v4'
        with:
          name: 'Closers'
          path: './domains/client/build/app/outputs/flutter-apk/'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./domains/client/build/web/

  # E2E-тесты авторизации на android-эмуляторе (Firebase Local Emulator Suite).
  # Запускается при PR и push в main (paths: domains/client/**).
  e2e-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 'Set up JDK 21'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android SDK components
        working-directory: ./domains/client
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "emulator" "platform-tools" \
            "system-images;android-34;google_apis;x86_64" > /dev/null

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Cache Firebase Emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('~/.cache/firebase/emulators/*.jar') }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-

      - name: Install dependencies
        working-directory: ./domains/client
        run: flutter pub get

      - name: Generate google-services.json
        working-directory: ./domains/client
        run: echo '{"project_info":{"project_number":"${{ secrets.CLOSERS_PROJECT_NUMBER }}","project_id":"${{ secrets.CLOSERS_PROJECT_ID }}","storage_bucket":"${{ secrets.CLOSERS_PROJECT_ID }}.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"${{ secrets.CLOSERS_ANDROID_APP_ID }}","android_client_info":{"package_name":"com.example.closers"}},"oauth_client":[],"api_key":[{"current_key":"${{ secrets.CLOSERS_ANDROID_API_KEY }}"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' >> android/app/google-services.json

      - name: Run android emulator e2e tests
        working-directory: ./domains/client
        run: |
          chmod +x tool/run_auth_e2e_tests.sh
          tool/run_auth_e2e_tests.sh --platform android

      - name: Upload e2e logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android-logs
          path: |
            /tmp/closers_e2e_emulator.log
            ./domains/client/.dart_tool/firebase_emulator/firebase.log
          if-no-files-found: ignore

  # ВЫНОСИМ ДЕПЛОЙ В ОТДЕЛЬНУЮ ДЖОБУ С ПРОВЕРКОЙ ВЕТКИ
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' # Деплоить только при пуше/слиянии в main
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2

      - name: Install dependencies
        working-directory: ./domains/client
        run: flutter pub get

      - name: Prepare Isar core library for macOS tests
        working-directory: ./domains/client
        run: |
          cp "$(find "$HOME/.pub-cache" -path '*isar_plus_flutter_libs*/macos/libisar.dylib' | head -n 1)" \
             test/libisar_macos.dylib

      - name: Run tests
        working-directory: ./domains/client
        run: flutter test

      - name: Run Firebase emulator integration tests
        working-directory: ./domains/client
        env:
          FLUTTER_WEB_CHROME: /usr/bin/google-chrome-stable
        run: |
          npm install -g firebase-tools@latest
          chmod +x tool/run_firebase_emulator_tests.sh
          tool/run_firebase_emulator_tests.sh

      - name: 'Build iOS (no codesign)'
        working-directory: ./domains/client
        run: |
          flutter build ios --release --no-codesign \
          --dart-define CLOSERS_PROJECT_ID=${{ secrets.CLOSERS_PROJECT_ID }} \
          --dart-define CLOSERS_PROJECT_NUMBER=${{ secrets.CLOSERS_PROJECT_NUMBER }} \
          --dart-define CLOSERS_IOS_API_KEY=${{ secrets.CLOSERS_IOS_API_KEY }} \
          --dart-define CLOSERS_IOS_APP_ID=${{ secrets.CLOSERS_IOS_APP_ID }} \
          --dart-define CLOSERS_DATABASE_URL=${{ secrets.CLOSERS_DATABASE_URL }}

      - name: 'Upload iOS app'
        uses: 'actions/upload-artifact@v4'
        with:
          name: 'Closers-iOS'
          path: './domains/client/build/ios/iphoneos/Runner.app'

  # E2E-тесты авторизации на iOS-симуляторе: Firebase-эмуляторы (auth + database)
  # поднимаются на раннере, симулятор загружается скриптом, тесты гоняются через
  # integration_test (integration_test/auth_e2e_test.dart). Локально то же самое:
  #   make test-auth-e2e-ios            (== tool/run_auth_e2e_tests.sh --platform ios)
  #   make test-auth-e2e-ios-debug      (--debug: verbose)
  #   make test-auth-e2e-ios-interactive(интерактивный запуск приложения на симуляторе)
  e2e-ios-simulator:
    runs-on: macos-latest
    # macOS-раннер: первый pod install может идти долго, но подвисший джобе
    # путь без лимита (кейс PR #54) крутится часами — ограничиваем жёстко.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2

      - name: Install dependencies
        working-directory: ./domains/client
        run: flutter pub get

      - name: Set up JDK 21
        # firebase-tools запускает эмуляторы через Java и требует JDK 21+.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install firebase-tools
        run: npm install -g firebase-tools@latest

      - name: Run auth e2e tests on iOS simulator
        working-directory: ./domains/client
        env:
          # Первый запуск собирает приложение под симулятор (pod install) —
          # даём шагу до 40 минут.
          FLUTTER_TEST_TIMEOUT: 40m
        run: |
          chmod +x tool/run_auth_e2e_tests.sh
          tool/run_auth_e2e_tests.sh --platform ios --debug

  # Сборка под Linux (desktop): юнит- и Isar-тесты выполняются нативно на
  # Linux (test/libisar_linux_x64.so закоммичен, локальный запуск без
  # браузера), затем сборка и выкладка артефактов. Firebase-интеграционные и
  # e2e-тесты вынесены в отдельную джобу e2e-linux (как e2e-android/e2e-ios):
  # нативных Firebase-плагинов для Linux нет, поэтому там они идут через
  # web-реализацию.
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libblkid-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2

      - name: Install dependencies
        working-directory: ./domains/client
        run: flutter pub get

      # Нативный запуск на Linux-раннере (VM), включая Isar-тесты
      # (test/libisar_linux_x64.so). Интеграционные тесты с эмулятором
      # пропускаются (Skip без RUN_EMULATOR_TESTS), они живут в e2e-linux.
      - name: Run tests
        working-directory: ./domains/client
        run: flutter test

      - name: 'Build Linux app'
        working-directory: ./domains/client
        run: flutter build linux --release

      - name: 'Upload Linux app'
        uses: 'actions/upload-artifact@v4'
        with:
          name: 'Closers-Linux'
          path: './domains/client/build/linux/x64/release/bundle/'

  # E2E-тесты на linux-раннере: Firebase-эмуляторы (auth + database)
  # поднимаются на раннере, e2e-набор гоняется отдельной джобой — как
  # e2e-android и e2e-ios-simulator. Нативных Firebase-плагинов для Linux
  # нет, поэтому используется web-вариант набора (headless chrome).
  e2e-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: 'Set up JDK 21'
        # firebase-tools запускает эмуляторы через Java и требует JDK 21+.
        uses: 'actions/setup-java@v4'
        with:
          distribution: "temurin"
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2

      - name: Install dependencies
        working-directory: ./domains/client
        run: flutter pub get

      - name: Install firebase-tools
        run: npm install -g firebase-tools@latest

      - name: Cache Firebase Emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('~/.cache/firebase/emulators/*.jar') }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-

      - name: Run e2e tests
        working-directory: ./domains/client
        env:
          FLUTTER_WEB_CHROME: /usr/bin/google-chrome-stable
        run: |
          chmod +x tool/run_auth_e2e_tests.sh
          tool/run_auth_e2e_tests.sh

      - name: Upload e2e logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-linux-logs
          path: |
            /tmp/closers_e2e_emulator.log
            ./domains/client/.dart_tool/firebase_emulator/firebase.log
          if-no-files-found: ignore

  # Сборка под Windows (desktop): тесты + сборка + выкладка артефактов.
  # isar-тесты на Windows используют закоммиченный test/isar_windows_x64.dll.
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2

      - name: Install dependencies
        working-directory: ./domains/client
        run: flutter pub get

      - name: Run tests
        working-directory: ./domains/client
        run: flutter test

      - name: 'Build Windows app'
        working-directory: ./domains/client
        run: flutter build windows --release

      - name: 'Upload Windows app'
        uses: 'actions/upload-artifact@v4'
        with:
          name: 'Closers-Windows'
          path: './domains/client/build/windows/x64/runner/Release/'
