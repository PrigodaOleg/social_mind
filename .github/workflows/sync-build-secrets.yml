# GitHub Actions workflow: отдаёт build-секреты (CLOSERS_*) self-hosted раннеру
# (нашей машине). Копируется в social_mind/.github/workflows/ и мержится в main.
#
# Как это работает: секреты живут ТОЛЬКО в GitHub (по API их значения не читаются).
# Единственный способ вытащить их наружу — workflow-джоба. Эта джоба выполняется
# НА НАШЕЙ машине (runs-on: self-hosted) и кладёт значения в /mnt/ssd/personal_worker/secrets/.
# Оттуда оркестратор читает их и прокидывает в сборку Flutter (google-services.json + --dart-define).
name: Sync build secrets to worker

on:
  workflow_dispatch: {}        # ручной запуск (по запросу воркера)
  schedule:
    - cron: "0 */6 * * *"      # держим файл свежим каждые 6 часов

jobs:
  sync:
    runs-on: self-hosted       # ← джоба стартует на нашей машине (self-hosted runner)
    steps:
      - name: Write secrets to /mnt/ssd/personal_worker/secrets
        env:
          CLOSERS_PROJECT_NUMBER: ${{ secrets.CLOSERS_PROJECT_NUMBER }}
          CLOSERS_PROJECT_ID: ${{ secrets.CLOSERS_PROJECT_ID }}
          CLOSERS_ANDROID_APP_ID: ${{ secrets.CLOSERS_ANDROID_APP_ID }}
          CLOSERS_ANDROID_API_KEY: ${{ secrets.CLOSERS_ANDROID_API_KEY }}
          CLOSERS_DATABASE_URL: ${{ secrets.CLOSERS_DATABASE_URL }}
        run: |
          python3 - <<'PY'
          import json, os
          d = "/mnt/ssd/personal_worker/secrets"
          os.makedirs(d, exist_ok=True)
          keys = ["CLOSERS_PROJECT_NUMBER", "CLOSERS_PROJECT_ID",
                  "CLOSERS_ANDROID_APP_ID", "CLOSERS_ANDROID_API_KEY",
                  "CLOSERS_DATABASE_URL"]
          v = {k: os.environ.get(k, "") for k in keys}

          # build.env — для --dart-define при сборке Flutter
          envp = os.path.join(d, "build.env")
          with open(envp, "w") as f:
              for k in keys:
                  f.write(f"{k}={v[k]}\n")
          os.chmod(envp, 0o600)

          # google-services.json — для Android-сборки (Firebase)
          gs = {
              "project_info": {
                  "project_number": v["CLOSERS_PROJECT_NUMBER"],
                  "project_id": v["CLOSERS_PROJECT_ID"],
                  "storage_bucket": v["CLOSERS_PROJECT_ID"] + ".appspot.com",
              },
              "client": [{
                  "client_info": {
                      "mobilesdk_app_id": v["CLOSERS_ANDROID_APP_ID"],
                      "android_client_info": {"package_name": "com.example.closers"},
                  },
                  "oauth_client": [],
                  "api_key": [{"current_key": v["CLOSERS_ANDROID_API_KEY"]}],
                  "services": {"appinvite_service": {"other_platform_oauth_client": []}},
              }],
              "configuration_version": "1",
          }
          gsp = os.path.join(d, "google-services.json")
          with open(gsp, "w") as f:
              json.dump(gs, f)
          os.chmod(gsp, 0o600)
          print("✅ build secrets synced to", d)
          PY
